name: Validar projeto

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Verificar formatação
        run: terraform fmt -check -recursive

      - name: Inicializar sem backend remoto
        run: terraform init -backend=false

      - name: Validar configuração
        run: terraform validate

  docker:
    name: Docker
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Construir a imagem
        run: docker build --tag cp04-site:test .

      - name: Iniciar o container
        run: docker run --detach --name cp04-test --publish 8080:80 cp04-site:test

      - name: Verificar o portal
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail http://localhost:8080/; then
              exit 0
            fi
            sleep 1
          done
          docker logs cp04-test
          exit 1
